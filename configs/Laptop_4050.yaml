# ==========================================
# RTX 4050 (6GB VRAM) OPTIMIZED CONFIG
# ==========================================
project_name: "SignLanguage_Swin3D"
experiment_name: "laptop_4050_run"
seed: 42

# ==========================================
# PATHS
# ==========================================
video_dir: "./videos"
extracted_frames_dir: "./extracted_frames_yolo"
wlasl_json_path: "./WLASL_v0.3.json"
output_dir: "./outputs"

# ==========================================
# MODEL CONFIG
# ==========================================
model_name: "swin3d_t"  # Options: swin3d_t, swin3d_s, swin3d_b
num_classes: 2000       # Dynamically updated by dataset loader
num_frames: 32          # Kept at 32 frames for paper fidelity
image_size: 224

# ==========================================
# TRAINING STRATEGY SELECTOR
# ==========================================
training_strategy: "paper_end2end"

# ==========================================
# PAPER END-TO-END STRATEGY
# ==========================================
paper_config:
  epochs: 30
  backbone_lr: 0.00003   # 3e-5 for backbone
  head_lr: 0.0003        # 3e-4 for head
  warmup_epochs: 2.5     # 2.5 warmup epochs
  weight_decay: 0.02

# ==========================================
# PROGRESSIVE UNFREEZING STRATEGY
# ==========================================
progressive_config:
  epochs_phase1: 10
  lr_phase1: 0.001
  epochs_phase2: 10
  lr_phase2: 0.0001
  epochs_phase3: 15
  lr_phase3: 0.00005

# ==========================================
# HARDWARE & HYPERPARAMETERS (Tuned for 6GB VRAM)
# ==========================================
batch_size: 4           # Small batch size to avoid CUDA Out-Of-Memory errors
accumulation_steps: 8   # Effective Batch Size = 4 * 8 = 32 (Matches original optimization!)
num_workers: 2          # Prevents CPU RAM overhead on Windows
label_smoothing: 0.1