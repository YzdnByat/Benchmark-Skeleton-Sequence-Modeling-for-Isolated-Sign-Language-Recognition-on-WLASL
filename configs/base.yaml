# ==========================================
# GENERAL & EXPERIMENT CONFIG
# ==========================================
project_name: "SignLanguage_Swin3D"
experiment_name: "baseline_paper_config"
seed: 42

# ==========================================
# PATHS
# ==========================================
video_dir: "./videos"
extracted_frames_dir: "./extracted_frames_yolo"
wlasl_json_path: "./WLASL_v0.3.json"
output_dir: "./outputs"

# ==========================================
# MODEL CONFIG
# ==========================================
model_name: "swin3d_t"  # Options: swin3d_t, swin3d_s, swin3d_b
num_classes: 2000       # Dynamically updated by dataset loader
num_frames: 32
image_size: 224

# ==========================================
# TRAINING STRATEGY SELECTOR
# ==========================================
# Options:
# 1. "paper_end2end"     -> Exact strategy from paper (differential LRs + Warmup)
# 2. "progressive"       -> 3-Phase Unfreezing (Head -> Stage4 -> Full)
# 3. "head_only"         -> Train classification head only
training_strategy: "paper_end2end"

# ==========================================
# CONFIG 1: PAPER END-TO-END
# ==========================================
paper_config:
  epochs: 30
  backbone_lr: 0.00003   # 3e-5 for backbone (as specified in paper)[cite: 1]
  head_lr: 0.0003        # 3e-4 for head (10x multiplier as specified in paper)[cite: 1]
  warmup_epochs: 2.5     # 2.5 warmup epochs[cite: 1]
  weight_decay: 0.02     # Weight decay from paper[cite: 1]

# ==========================================
# CONFIG 2: PROGRESSIVE UNFREEZING
# ==========================================
progressive_config:
  epochs_phase1: 10      # Phase 1: Head Only
  lr_phase1: 0.001
  epochs_phase2: 10      # Phase 2: Head + Stage 4
  lr_phase2: 0.0001
  epochs_phase3: 15      # Phase 3: Full Model
  lr_phase3: 0.00005

# ==========================================
# HARDWARE & HYPERPARAMETERS (RTX 5090 Ready)
# ==========================================
batch_size: 16          # Effective batch size = 16 * 2 = 32
accumulation_steps: 2
num_workers: 4
label_smoothing: 0.1